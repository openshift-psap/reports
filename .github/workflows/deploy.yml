name: Deploy PSAP Reports Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::194365112018:role/github-actions-psap-reports-deploy
          aws-region: us-east-1

      - name: Install AWS CLI
        run: pip install -q awscli

      - name: Generate the report hub shell
        run: python3 _generator/generate_index.py

      - name: Upload the report hub shell
        run: |
          BUCKET=$(python3 -c "import json; print(json.load(open('_generator/s3_config.json'))['bucket'])")
          aws s3 cp index.html "s3://${BUCKET}/index.html" --content-type text/html --cache-control no-store
          aws s3 cp index.html "s3://${BUCKET}/admin/index.html" --content-type text/html --cache-control no-store
          aws s3 cp public-reports.json "s3://${BUCKET}/public-reports.json" --content-type application/json --cache-control no-store

      - name: Invalidate the report hub shell
        run: aws cloudfront create-invalidation --distribution-id E3URYTY8ICV8ON --paths / /index.html /admin/index.html /public-reports.json
