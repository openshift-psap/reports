name: Deploy PSAP Reports Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Diagnose OIDC claims
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          request = urllib.request.Request(
              url,
              headers={"Authorization": f"bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"},
          )
          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]
          payload = token.split(".")[1] + "==="
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in ("iss", "aud", "sub", "repository", "ref", "environment"):
              print(f"OIDC {key}: {claims.get(key)}")
          PY

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::194365112018:role/github-actions-psap-reports-deploy
          aws-region: us-east-1

      - name: Install AWS CLI
        run: pip install -q awscli

      - name: Validate report source
        run: python3 _generator/validate_reports.py

      - name: Publish report artifacts to S3
        run: python3 _generator/publish_reports.py --paths-file .cloudfront-paths

      - name: Generate index.html and report manifests
        run: python3 _generator/generate_index.py

      - name: Upload generated hub artifacts
        run: |
          BUCKET=$(python3 -c "import json; print(json.load(open('_generator/s3_config.json'))['bucket'])")
          if [ -f public-reports.json ]; then aws s3 cp public-reports.json "s3://${BUCKET}/public-reports.json"; else aws s3 rm "s3://${BUCKET}/public-reports.json"; fi
          if [ -f private-entries.json ]; then aws s3 cp private-entries.json "s3://${BUCKET}/private-entries.json"; else aws s3 rm "s3://${BUCKET}/private-entries.json"; fi
          aws s3 cp index.html "s3://${BUCKET}/admin/index.html" --content-type text/html --cache-control no-store

      - name: Invalidate published CloudFront paths
        run: |
          mapfile -t PATHS < .cloudfront-paths
          PATHS+=(/public-reports.json /private-entries.json /admin/index.html)
          aws cloudfront create-invalidation --distribution-id E3URYTY8ICV8ON --paths "${PATHS[@]}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
