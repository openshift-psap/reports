name: Deploy PSAP Reports Full Stack

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_mode:
        description: 'Production issuance mode (preserve is the normal release)'
        type: choice
        options: [preserve, paused, v2]
        default: preserve

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: psap-reports-full-stack
  cancel-in-progress: false

jobs:
  tests:
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  build-and-deploy:
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Retained as the OIDC-protected deployment environment. This does not
    # publish GitHub Pages; the hub itself is deployed only to S3/CloudFront.
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::194365112018:role/github-actions-psap-reports-deploy
          aws-region: us-east-1

      - name: Install release validation tools
        run: pip install -q awscli cfn-lint

      - name: Validate publication infrastructure
        run: cfn-lint _infra/publication-stack.json

      - name: Deploy and exercise isolated validation environment
        run: python3 _infra/validate-release.py --commit "$GITHUB_SHA" --evidence validation-release.json

      - name: Deploy production backend and verify readiness
        env:
          UPLOAD_MODE: ${{ inputs.upload_mode || 'preserve' }}
        run: python3 _infra/release.py --target production --commit "$GITHUB_SHA" --upload-mode "$UPLOAD_MODE" --evidence backend-release.json

      - name: Generate the report hub shell
        run: python3 _generator/generate_index.py

      - name: Upload the report hub shell and privacy page
        run: |
          BUCKET=$(python3 -c "import json; print(json.load(open('_generator/s3_config.json'))['bucket'])")
          aws s3 cp index.html "s3://${BUCKET}/index.html" --content-type text/html --cache-control no-store
          aws s3 cp index.html "s3://${BUCKET}/admin/index.html" --content-type text/html --cache-control no-store
          aws s3 cp privacy.html "s3://${BUCKET}/privacy.html" --content-type text/html --cache-control no-store
          aws s3 cp public-reports.json "s3://${BUCKET}/public-reports.json" --content-type application/json --cache-control no-store

      - name: Invalidate the report hub shell and privacy page
        run: |
          ID=$(aws cloudfront create-invalidation --distribution-id E3URYTY8ICV8ON --paths / /index.html /admin/index.html /public-reports.json /privacy.html --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id E3URYTY8ICV8ON --id "$ID"

      - name: Verify production frontend and API (read-only)
        run: python3 _infra/release.py --target production --phase smoke --commit "$GITHUB_SHA" --evidence frontend-release.json

      - name: Retain sanitized release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: |
            validation-release.json
            backend-release.json
            frontend-release.json
          if-no-files-found: ignore
          retention-days: 30

      # Preserve old GitHub Pages bookmarks without hosting report data there.
      # Scope the artifact to this attempt so reruns cannot select earlier uploads.
      - name: Publish legacy Pages redirect
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: legacy-pages-redirect

      - name: Deploy legacy Pages redirect
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
