name: Report Hub Tests

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-tests:
    name: Regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run API and form regression tests
        run: node --test tests/*.test.js

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run local MCP integration tests
        run: |
          python -m pip install -r requirements-mcp.txt
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Validate deployment templates and scripts
        run: |
          python -m pip install cfn-lint
          cfn-lint _infra/publication-stack.json
          python -m py_compile _infra/release.py _infra/validate-release.py _infra/release-policy.py
